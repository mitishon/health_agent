<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #eef1f5 0%, #dce6f5 100%);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 16px;
  }
  .card {
    width: 100%; max-width: 380px;
    background: #fff; border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    padding: 32px 24px; text-align: center;
  }
  .icon {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    border-radius: 50%; display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 30px; margin-bottom: 16px;
  }
  h1 { font-size: 22px; color: #1a1a1a; margin-bottom: 8px; }
  p { font-size: 13px; color: #666; line-height: 1.8; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1>Health Agent</h1>
    <p>AI Health Analysis · Secure</p>
    <p style="margin-top: 16px; font-size: 12px; color: #999;">
      نسخه آزمایشی — در حال راه‌اندازی
    </p>
  </div>
</body>
</html>
