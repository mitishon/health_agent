<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Agent — تست تلگرام</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #eef1f5 0%, #dce6f5 100%);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 16px;
  }
  .card {
    width: 100%; max-width: 380px;
    background: #fff; border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    padding: 32px 24px; text-align: center;
  }
  .icon {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    border-radius: 50%; display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 30px; margin-bottom: 16px;
  }
  h1 { font-size: 22px; color: #1a1a1a; margin-bottom: 8px; }
  p { font-size: 13px; color: #666; line-height: 1.8; margin-bottom: 20px; }
  button {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-family: Tahoma; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .status { margin-top: 16px; font-size: 13px; color: #666; min-height: 20px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1>Health Agent</h1>
    <p>تست اتصال به تلگرام</p>
    <button id="testBtn">ارسال پیام تست</button>
    <div class="status" id="statusText"></div>
  </div>

<script>
/* ============================================================
   بخش ۱: تنظیمات — این دو مقدار را با مقادیر واقعی خودت جایگزین کن
   ============================================================ */
const BOT_TOKEN = '8986087239:AAEw2wedRgnuYQLMYop2ztHv7KqQTGtvfSE'                               
  ;   // توکن ربات تلگرام
const CHAT_ID   = '602417928'                    
                      
                      
                      
  ;     // آیدی چت تلگرام

/* ============================================================
   بخش ۲: المان‌ها
   ============================================================ */
const testBtn = document.getElementById('testBtn');
const statusText = document.getElementById('statusText');

/* ============================================================
   بخش ۳: رویداد کلیک روی دکمه تست
   ============================================================ */
testBtn.addEventListener('click', async () => {
  testBtn.disabled = true;
  statusText.textContent = 'در حال ارسال...';

  try {
    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: '✅ تست موفق! اتصال Health Agent به تلگرام برقرار است.'
      })
    });

    const data = await res.json();

    if (data.ok) {
      statusText.textContent = '✅ پیام با موفقیت ارسال شد. تلگرام را چک کن.';
    } else {
      statusText.textContent = '❌ خطا: ' + (data.description || 'نامشخص');
    }
  } catch (e) {
    statusText.textContent = '❌ خطای شبکه: ' + e.message;
  }

  testBtn.disabled = false;
});
</script>
</body>
</html>
